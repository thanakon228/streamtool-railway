<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>StreamTool Overlay</title>
  <!-- Template CSS (swapped live by JS) -->
  <link id="tpl-css" rel="stylesheet" href="/templates/classic.css">
  <style id="tpl-custom"></style>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html, body { width:100%; height:100%; background:transparent; overflow:hidden;
      font-family:'Segoe UI','Noto Sans Thai',system-ui,sans-serif;
      perspective:1200px;
    }

    /* ── Alert zone position ───────────────────────────────────── */
    #alert-zone { position:fixed; width:420px; pointer-events:none;
      top:40px; right:40px; /* default: top-right */
    }
    body.pos-top-left     #alert-zone { top:40px;    left:40px;   right:auto; bottom:auto; }
    body.pos-bottom-right #alert-zone { bottom:180px;right:40px;  left:auto;  top:auto;    }
    body.pos-bottom-left  #alert-zone { bottom:180px;left:40px;   right:auto; top:auto;    }

    /* ── Alert card — uses template vars ───────────────────────── */
    #alert-card {
      background:    transparent;
      border:        1.5px solid var(--t-alert-border);
      border-radius: var(--t-alert-radius, 18px);
      box-shadow:    var(--t-alert-shadow);
      overflow:hidden; position:relative;
      opacity:0; will-change:transform,opacity;
      transition: opacity .4s cubic-bezier(.34,1.3,.64,1),
                  transform .4s cubic-bezier(.34,1.3,.64,1);
    }
    #alert-card.hide { transition: opacity .28s ease-in, transform .28s ease-in !important; }
    #alert-card.show .alert-avatar { animation: avatarPop .5s cubic-bezier(.34,1.56,.64,1) .18s both; }
    #alert-card.show .alert-amount { animation: amountPop .5s cubic-bezier(.34,1.56,.64,1) .28s both; }
    @keyframes avatarPop { from{transform:scale(0) rotate(-12deg)} to{transform:scale(1) rotate(0)} }
    @keyframes amountPop { from{transform:scale(.4);opacity:0}     to{transform:scale(1);opacity:1} }

    /* accent bar */
    .alert-accent-bar {
      height:3px; background:var(--t-alert-bar);
      background-size:300% 100%; animation:gradShift 4s linear infinite;
    }
    @keyframes gradShift { 0%{background-position:0%} 100%{background-position:300%} }

    .alert-body   { padding:16px 20px 20px; }
    .alert-header { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
    .alert-avatar {
      width:52px; height:52px; border-radius:50%;
      background:var(--t-avatar-bg);
      display:flex; align-items:center; justify-content:center;
      font-size:24px; font-weight:800; color:#fff; flex-shrink:0;
      box-shadow: 0 0 20px var(--t-avatar-glow), 0 0 40px color-mix(in srgb,var(--t-avatar-glow) 40%,transparent);
    }
    .alert-name-wrap { flex:1; min-width:0; }
    .alert-label { font-size:10px; color:var(--t-alert-label); text-transform:uppercase; letter-spacing:.1em; margin-bottom:3px; }
    .alert-name  { font-size:17px; font-weight:700; color:var(--t-alert-name); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .alert-amount{ font-size:30px; font-weight:900; color:var(--t-alert-amount);
      text-shadow: 0 0 22px var(--t-alert-amount-glow); white-space:nowrap; flex-shrink:0; }
    .alert-message{
      font-size:13px; color:var(--t-alert-msg-color); line-height:1.55;
      background:var(--t-alert-msg-bg); border-radius:9px;
      padding:10px 14px; margin-top:2px; border-left:2px solid var(--t-alert-msg-border);
    }

    /* ── Animations ────────────────────────────────────────────── */
    body.anim-slide          #alert-card      { transform:translateX(460px) scale(.92); }
    body.anim-slide          #alert-card.show { transform:translateX(0) scale(1); opacity:1; }
    body.anim-slide          #alert-card.hide { transform:translateX(460px) scale(.92); opacity:0; }
    body.pos-top-left.anim-slide    #alert-card      { transform:translateX(-460px) scale(.92); }
    body.pos-top-left.anim-slide    #alert-card.show { transform:translateX(0) scale(1); opacity:1; }
    body.pos-top-left.anim-slide    #alert-card.hide { transform:translateX(-460px) scale(.92); opacity:0; }
    body.pos-bottom-left.anim-slide #alert-card      { transform:translateX(-460px) scale(.92); }
    body.pos-bottom-left.anim-slide #alert-card.show { transform:translateX(0) scale(1); opacity:1; }
    body.pos-bottom-left.anim-slide #alert-card.hide { transform:translateX(-460px) scale(.92); opacity:0; }

    body.anim-bounce #alert-card      { transform:translateY(-90px) scale(.85); opacity:0; }
    body.anim-bounce #alert-card.show { transform:translateY(0) scale(1); opacity:1;
      transition:opacity .35s ease,transform .55s cubic-bezier(.22,1.8,.36,1); }
    body.anim-bounce #alert-card.hide { transform:translateY(-60px) scale(.88); opacity:0; }

    body.anim-zoom   #alert-card      { transform:scale(.2) translateY(20px); opacity:0; }
    body.anim-zoom   #alert-card.show { transform:scale(1) translateY(0); opacity:1;
      transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.56,.64,1); }
    body.anim-zoom   #alert-card.hide { transform:scale(.2) translateY(20px); opacity:0; }

    body.anim-flip   #alert-card      { transform:rotateY(90deg) scaleX(.6); opacity:0; }
    body.anim-flip   #alert-card.show { transform:rotateY(0deg) scaleX(1); opacity:1;
      transition:opacity .3s ease,transform .5s cubic-bezier(.34,1.2,.64,1); }
    body.anim-flip   #alert-card.hide { transform:rotateY(-90deg) scaleX(.6); opacity:0; }

    body.anim-drop   #alert-card      { transform:translateY(-120px) rotate(-6deg) scale(.8); opacity:0; }
    body.anim-drop   #alert-card.show { transform:translateY(0) rotate(0) scale(1); opacity:1;
      transition:opacity .3s ease,transform .6s cubic-bezier(.22,1.5,.36,1); }
    body.anim-drop   #alert-card.hide { transform:translateY(60px) rotate(4deg) scale(.85); opacity:0; }

    /* ── Confetti ──────────────────────────────────────────────── */
    .confetti-wrap { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    .cp { position:absolute; animation:cfFall linear forwards; opacity:0; }
    @keyframes cfFall {
      0%   { opacity:1; transform:translateY(-20px) rotate(0deg); }
      100% { opacity:0; transform:translateY(110vh) rotate(720deg); }
    }

    /* ── Chat (social_stream-style) ───────────────────────────── */
    #chat-zone {
      position:fixed;
      width:var(--chat-width, 360px);
      font-size:var(--chat-font-size, 13px);
      display:flex; flex-direction:column; gap:7px; pointer-events:none;
      top:auto; bottom:160px; left:40px; right:auto;
    }
    body.chat-pos-top-left     #chat-zone { top:40px;    left:40px;   right:auto; bottom:auto; }
    body.chat-pos-top-right    #chat-zone { top:40px;    right:40px;  left:auto;  bottom:auto; }
    body.chat-pos-bottom-left  #chat-zone { bottom:160px;left:40px;   right:auto; top:auto;    }
    body.chat-pos-bottom-right #chat-zone { bottom:160px;right:40px;  left:auto;  top:auto;    }
    body.chat-hidden #chat-zone { display:none !important; }
    body.chat-no-avatar .chat-avatar { display:none; }
    body.chat-no-pill   .chat-pill   { display:none; }
    body.chat-no-badge  .chat-bits, body.chat-no-badge .chat-dono { display:none; }
    .chat-msg {
      display:flex; align-items:flex-start; gap:10px; position:relative;
      background:transparent; border:1px solid var(--t-chat-border);
      border-radius:var(--t-chat-radius); padding:9px 13px;
      backdrop-filter:blur(var(--t-chat-blur, 10px));
      animation:chatIn .35s cubic-bezier(.22,1.5,.36,1);
      transition:opacity .45s ease, transform .45s ease;
      font-size:inherit;
      text-shadow:var(--t-chat-shadow, none);
    }
    .chat-msg.has-donation {
      background:linear-gradient(135deg, rgba(245,158,11,.18), rgba(236,72,153,.12));
      border-color:rgba(245,158,11,.5);
      box-shadow:0 0 24px rgba(245,158,11,.18);
    }
    .chat-msg.fade-out { opacity:0; transform:translateX(-28px) scale(.95); }
    /* Random spotlight — Mac-dock style magnify */
    .chat-msg.spotlight {
      transform:scale(1.65); transform-origin:left center; z-index:20;
      background:rgba(0,0,0,.6); backdrop-filter:blur(6px);
      border-radius:14px; padding:12px 16px;
      box-shadow:0 0 0 2px var(--t-primary,#7c5cfc), 0 14px 50px rgba(0,0,0,.65);
      transition:transform .5s cubic-bezier(.22,1.4,.36,1), box-shadow .4s ease, background .4s ease;
    }
    body.chat-pos-top-right .chat-msg.spotlight,
    body.chat-pos-bottom-right .chat-msg.spotlight { transform-origin:right center; }
    .chat-msg.spotlight .chat-text { color:#fff; }
    /* Spotlight — top-center mode */
    #spotlight-zone {
      position:fixed; top:48px; left:50%; transform:translateX(-50%);
      width:min(680px,86vw); display:flex; justify-content:center;
      pointer-events:none; opacity:0; z-index:50; transition:opacity .4s ease;
    }
    #spotlight-zone.show { opacity:1; }
    #spotlight-card {
      display:flex; align-items:center; gap:16px;
      background:rgba(8,8,16,.82); backdrop-filter:blur(10px);
      border:2px solid var(--t-primary,#7c5cfc); border-radius:18px; padding:18px 24px;
      box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 40px var(--t-avatar-glow,rgba(124,92,252,.4));
      transform:scale(.55); transition:transform .55s cubic-bezier(.22,1.6,.36,1);
      max-width:100%;
    }
    #spotlight-zone.show #spotlight-card { transform:scale(1); }
    #spotlight-card .sl-av {
      width:54px; height:54px; border-radius:50%; flex-shrink:0;
      background:var(--t-avatar-bg,linear-gradient(135deg,#7c5cfc,#ec4899)); background-size:cover; background-position:center;
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:22px;
    }
    #spotlight-card .sl-body { min-width:0; }
    #spotlight-card .sl-name { font-size:18px; font-weight:800; color:var(--t-alert-name,#fff); margin-bottom:4px; }
    #spotlight-card .sl-text { font-size:24px; font-weight:600; color:#fff; line-height:1.3; word-break:break-word; }

    /* ── Featured message (manual / pinned) — reuses spotlight look ───── */
    #feature-zone {
      position:fixed; top:48px; left:50%; transform:translateX(-50%);
      width:min(680px,86vw); display:flex; justify-content:center;
      pointer-events:none; opacity:0; z-index:55; transition:opacity .4s ease;
    }
    #feature-zone.show { opacity:1; }
    #feature-card {
      display:flex; align-items:center; gap:16px;
      background:rgba(8,8,16,.85); backdrop-filter:blur(10px);
      border:2px solid var(--t-primary,#7c5cfc); border-radius:18px; padding:18px 24px;
      box-shadow:0 18px 60px rgba(0,0,0,.6), 0 0 40px var(--t-avatar-glow,rgba(124,92,252,.4));
      transform:scale(.55); transition:transform .55s cubic-bezier(.22,1.6,.36,1); max-width:100%;
    }
    #feature-zone.show #feature-card { transform:scale(1); }
    #feature-card .ft-av {
      width:54px; height:54px; border-radius:50%; flex-shrink:0;
      background:var(--t-avatar-bg,linear-gradient(135deg,#7c5cfc,#ec4899)); background-size:cover; background-position:center;
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:22px;
    }
    #feature-card .ft-pin { position:absolute; top:-10px; left:-10px; font-size:20px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
    #feature-card { position:relative; }
    #feature-card .ft-body { min-width:0; }
    #feature-card .ft-name { font-size:18px; font-weight:800; color:var(--t-alert-name,#fff); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
    #feature-card .ft-pill { font-size:11px; padding:1px 8px; border-radius:8px; background:var(--t-primary,#7c5cfc); color:#fff; font-weight:700; }
    #feature-card .ft-text { font-size:24px; font-weight:600; color:#fff; line-height:1.3; word-break:break-word; }

    /* ── Giveaway winner ──────────────────────────────────────────────── */
    #giveaway-zone {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none; opacity:0; z-index:60; transition:opacity .4s ease;
    }
    #giveaway-zone.show { opacity:1; }
    #giveaway-card {
      text-align:center; padding:34px 56px; border-radius:24px;
      background:linear-gradient(135deg,rgba(124,92,252,.92),rgba(236,72,153,.92));
      box-shadow:0 24px 80px rgba(0,0,0,.6), 0 0 60px rgba(236,72,153,.5);
      transform:scale(.4) rotate(-4deg); transition:transform .6s cubic-bezier(.22,1.7,.36,1);
    }
    #giveaway-zone.show #giveaway-card { transform:scale(1) rotate(0); }
    #giveaway-card .gw-label { font-size:16px; font-weight:700; color:rgba(255,255,255,.85); letter-spacing:.18em; text-transform:uppercase; margin-bottom:10px; }
    #giveaway-card .gw-name  { font-size:46px; font-weight:900; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.4); word-break:break-word; max-width:80vw; }
    #giveaway-card .gw-emoji { font-size:40px; margin-bottom:6px; animation:gwBounce 1s ease infinite; }
    #giveaway-card .gw-emoji.spin { animation:gwSpin .55s linear infinite; }
    @keyframes gwBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes gwSpin { to { transform:rotate(360deg); } }
    /* name-roll states */
    #giveaway-card .gw-name.rolling { opacity:.82; filter:blur(.4px); }
    #giveaway-card .gw-name.reveal  { animation:gwReveal .5s cubic-bezier(.22,1.7,.36,1); }
    @keyframes gwReveal { 0%{transform:scale(1.35)} 55%{transform:scale(.93)} 100%{transform:scale(1)} }
    @keyframes chatIn { from{opacity:0;transform:translateX(-18px)} to{opacity:1;transform:translateX(0)} }

    .chat-avatar {
      width:36px; height:36px; border-radius:50%;
      background:var(--t-avatar-bg, linear-gradient(135deg,#7c5cfc,#ec4899));
      background-size:cover; background-position:center;
      flex-shrink:0; position:relative;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:700; font-size:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
    .chat-avatar.has-img .chat-avatar-fb { display:none; }

    .chat-pill {
      position:absolute; bottom:-3px; right:-3px;
      width:18px; height:18px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:10px; line-height:1;
      border:2px solid var(--t-chat-pill-border, #0a0a0a);
      background:#18181b; color:#fff;
    }
    .chat-pill.youtube  { background:#ff0033; }
    .chat-pill.tiktok   { background:#000; }
    .chat-pill.twitch   { background:#9147ff; }
    .chat-pill.kick     { background:#53fc18; color:#000; }
    .chat-pill.facebook { background:#1877f2; }

    .chat-body { flex:1; min-width:0; }
    .chat-meta { display:flex; align-items:center; gap:6px; margin-bottom:2px; flex-wrap:wrap; }
    .chat-name  { font-size:0.92em; font-weight:var(--t-chat-name-weight,700); }
    .chat-name.youtube  { color:var(--t-chat-yt, #ff4444); }
    .chat-name.tiktok   { color:var(--t-chat-tt, #69c9d0); }
    .chat-name.twitch   { color:#b18bff; }
    .chat-name.kick     { color:#53de44; }
    .chat-name.facebook { color:#4c92f5; }
    .chat-text  { font-size:1em; color:var(--t-chat-text); line-height:1.45; word-break:break-word; }

    .chat-bits, .chat-dono {
      display:inline-flex; align-items:center; gap:3px;
      padding:1px 7px; border-radius:9px;
      font-size:10px; font-weight:800; letter-spacing:.03em; white-space:nowrap;
    }
    .chat-bits { background:linear-gradient(90deg,#fbbf24,#f59e0b); color:#1a1a1a; }
    .chat-dono { background:linear-gradient(90deg,#ec4899,#a855f7); color:#fff;
      box-shadow:0 0 12px rgba(236,72,153,.45); }

    /* ── Goal bar ──────────────────────────────────────────────── */
    #goal-zone {
      position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
      width:560px; max-width:calc(100vw - 80px);
      pointer-events:none; opacity:0; transition:opacity .5s ease;
    }
    #goal-zone.visible { opacity:1; }
    .goal-card {
      background:transparent; border:1px solid var(--t-goal-border);
      border-radius:var(--t-goal-radius); padding:14px 18px;
      backdrop-filter:blur(var(--t-goal-blur));
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      position:relative;
    }
    /* Background layers — opacity controlled by --ov-bg-alpha (theme bg-opacity setting).
       Kept on ::before so opacity scales solid AND gradient backgrounds without dimming text. */
    #alert-card::before, .chat-msg::before, .goal-card::before {
      content:''; position:absolute; inset:0; z-index:-1; border-radius:inherit;
      opacity:var(--ov-bg-alpha, 1); pointer-events:none;
    }
    #alert-card::before { background:var(--t-alert-bg); }
    .chat-msg::before   { background:var(--t-chat-bg); }
    .goal-card::before  { background:var(--t-goal-bg); }

    /* ── Now Playing (song request) ─────────────────────────────── */
    #np-zone { position:fixed; top:24px; left:24px; pointer-events:none; z-index:40; }
    body.np-pos-top-right    #np-zone { top:24px; right:24px; left:auto; bottom:auto; }
    body.np-pos-bottom-left  #np-zone { bottom:24px; left:24px; top:auto; right:auto; }
    body.np-pos-bottom-right #np-zone { bottom:24px; right:24px; top:auto; left:auto; }
    body.np-off #np-zone { display:none !important; }
    #np-card {
      display:flex; align-items:center; gap:14px; max-width:420px; padding:12px 18px 12px 12px;
      background:var(--t-goal-bg, rgba(12,14,22,.9)); border:1px solid var(--t-goal-border, rgba(124,92,252,.35));
      border-radius:14px; backdrop-filter:blur(var(--t-goal-blur,12px)); box-shadow:0 10px 40px rgba(0,0,0,.5);
      opacity:0; transform:translateY(14px); transition:opacity .45s ease, transform .45s ease;
    }
    #np-card.show { opacity:1; transform:translateY(0); }
    .np-thumb { position:relative; width:84px; height:48px; border-radius:8px; overflow:hidden; flex-shrink:0; background:rgba(255,255,255,.06); }
    .np-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .np-eq { position:absolute; left:6px; bottom:5px; display:flex; align-items:flex-end; gap:2px; height:16px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
    .np-eq span { width:3px; height:5px; background:var(--t-primary,#7c5cfc); border-radius:2px; animation:npEq .9s ease-in-out infinite; }
    .np-eq span:nth-child(2){ animation-delay:.18s; }
    .np-eq span:nth-child(3){ animation-delay:.36s; }
    .np-eq span:nth-child(4){ animation-delay:.54s; }
    @keyframes npEq { 0%,100%{height:4px} 50%{height:15px} }
    .np-info { min-width:0; }
    .np-label { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--t-goal-title,rgba(255,255,255,.6)); margin-bottom:3px; }
    .np-title { font-size:15px; font-weight:700; color:var(--t-alert-name,#fff); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px; text-shadow:var(--t-chat-shadow,0 1px 3px rgba(0,0,0,.6)); }
    .np-sub { font-size:11px; color:var(--t-goal-percent,rgba(255,255,255,.55)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px; margin-top:2px; }
    .goal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .goal-title  { font-size:12px; font-weight:700; color:var(--t-goal-title); display:flex; align-items:center; gap:6px; }
    .goal-amounts{ font-size:13px; font-weight:700; }
    .goal-current{ color:var(--t-goal-current); text-shadow:0 0 14px var(--t-goal-current-glow); }
    .goal-sep    { color:rgba(128,128,128,.5); margin:0 4px; }
    .goal-target { color:var(--t-goal-target); }
    .goal-track  { height:10px; background:var(--t-goal-track); border-radius:99px; overflow:hidden; }
    .goal-fill   {
      height:100%; background:var(--t-goal-bar);
      box-shadow:0 0 12px var(--t-goal-bar-glow);
      border-radius:99px; width:0%; transition:width 1.2s cubic-bezier(.34,1.1,.64,1);
      position:relative; overflow:hidden;
    }
    .goal-fill::after {
      content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
      animation:gShimmer 2s ease infinite;
    }
    @keyframes gShimmer { to { left:200%; } }
    .goal-percent{ font-size:11px; color:var(--t-goal-percent); text-align:right; margin-top:5px; }
  </style>
</head>
<body class="anim-slide pos-top-right">

<div class="confetti-wrap" id="confetti-wrap"></div>

<!-- Alert -->
<div id="alert-zone">
  <div id="alert-card">
    <div class="alert-accent-bar"></div>
    <div class="alert-body">
      <div class="alert-header">
        <div class="alert-avatar" id="alert-avatar">?</div>
        <div class="alert-name-wrap">
          <div class="alert-label">Donation 💜</div>
          <div class="alert-name" id="alert-name">—</div>
        </div>
        <div class="alert-amount" id="alert-amount">฿0</div>
      </div>
      <div class="alert-message" id="alert-message" style="display:none;"></div>
    </div>
  </div>
</div>

<!-- Chat -->
<div id="chat-zone"></div>

<!-- Spotlight (top-center mode) -->
<div id="spotlight-zone"><div id="spotlight-card">
  <div class="sl-av" id="sl-av"></div>
  <div class="sl-body"><div class="sl-name" id="sl-name"></div><div class="sl-text" id="sl-text"></div></div>
</div></div>

<!-- Featured message (manual / pinned) -->
<div id="feature-zone"><div id="feature-card">
  <span class="ft-pin" id="ft-pin" style="display:none;">📌</span>
  <div class="ft-av" id="ft-av"></div>
  <div class="ft-body">
    <div class="ft-name"><span id="ft-name"></span><span class="ft-pill" id="ft-pill"></span></div>
    <div class="ft-text" id="ft-text"></div>
  </div>
</div></div>

<!-- Giveaway winner -->
<div id="giveaway-zone"><div id="giveaway-card">
  <div class="gw-emoji" id="gw-emoji">🎲</div>
  <div class="gw-label" id="gw-label">กำลังสุ่ม...</div>
  <div class="gw-name" id="gw-name"></div>
</div></div>

<!-- Goal -->
<div id="goal-zone">
  <div class="goal-card">
    <div class="goal-header">
      <div class="goal-title"><span>🎯</span><span id="goal-title-text">Goal วันนี้</span></div>
      <div class="goal-amounts">
        <span class="goal-current" id="goal-current">฿0</span>
        <span class="goal-sep">/</span>
        <span class="goal-target" id="goal-target">฿0</span>
      </div>
    </div>
    <div class="goal-track"><div class="goal-fill" id="goal-fill"></div></div>
    <div class="goal-percent" id="goal-percent">0%</div>
  </div>
</div>

<!-- Now Playing (song request) -->
<div id="np-zone"><div id="np-card">
  <div class="np-thumb"><img id="np-img" alt=""><div class="np-eq"><span></span><span></span><span></span><span></span></div></div>
  <div class="np-info">
    <div class="np-label">🎵 กำลังเล่น</div>
    <div class="np-title" id="np-title"></div>
    <div class="np-sub" id="np-sub"></div>
  </div>
</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const overlayId = location.pathname.replace(/^\/overlay\/?/,'').split('/')[0];
  if (!overlayId) {
    document.body.innerHTML = '<div style="color:red;padding:20px;font-size:18px;">ไม่พบ Overlay ID — ตรวจสอบ URL</div>';
  } else { init(); }

  async function init() {
    try {
      const cfg = await fetch('/api/template-config').then(r => r.json());
      applyTemplate(cfg);
    } catch(e) {}

    const socket = io({ auth: { overlayId } });
    socket.on('templateUpdate', applyTemplate);
    socket.on('goalUpdate',     updateGoal);
    socket.on('alert', d => { alertQueue.push(d); processQueue(); });
    socket.on('chat',  appendChatMsg);
    socket.on('spotlightNow', () => runSpotlight());
    socket.on('feature',        showFeature);
    socket.on('featureClear',   hideFeature);
    socket.on('giveawayWinner', showGiveawayWinner);
    socket.on('nowPlaying',     renderNowPlaying);
    // Self-heal: re-sync theme/goal on every (re)connect — OBS browser sources
    // often drop the socket on scene switch and would otherwise show a stale theme.
    socket.on('connect', async () => {
      try {
        const cfg = await fetch('/api/template-config').then(r => r.json());
        applyTemplate(cfg);
        updateGoal(cfg.goal || {});
        renderNowPlaying(await fetch('/api/songreq/nowplaying').then(r => r.json()));
      } catch (e) {}
    });
  }

  /* ── Template apply ──────────────────────────────────────────── */
  function applyTemplate(cfg) {
    // Swap stylesheet
    const link = document.getElementById('tpl-css');
    const name  = ['classic','neon','minimal','gaming','cute','ocean','sunset','gold','forest','vapor'].includes(cfg.template) ? cfg.template : 'classic';
    if (link.href !== location.origin + '/templates/' + name + '.css') link.href = '/templates/' + name + '.css';
    // Custom CSS
    document.getElementById('tpl-custom').textContent = cfg.customCss || '';
    // Background opacity (0–100 → 0–1) for card backgrounds
    const bgo = (typeof cfg.bgOpacity === 'number') ? cfg.bgOpacity : 100;
    document.body.style.setProperty('--ov-bg-alpha', Math.max(0, Math.min(100, bgo)) / 100);
    // Animation + position classes
    const anims = ['slide','bounce','zoom','flip','drop'];
    const pos   = ['top-right','top-left','bottom-right','bottom-left'];
    const body  = document.body;
    anims.forEach(a => body.classList.remove('anim-'+a));
    pos  .forEach(p => body.classList.remove('pos-'+p));
    body.classList.add('anim-' + (anims.includes(cfg.alertAnimation) ? cfg.alertAnimation : 'slide'));
    body.classList.add('pos-'  + (pos  .includes(cfg.alertPosition)  ? cfg.alertPosition  : 'top-right'));
    applyChatConfig(cfg.chatConfig);
    applySpotlightConfig(cfg.spotlight);
    applyNowPlayingConfig(cfg.nowPlaying);
  }

  /* ── Now Playing config + render ─────────────────────────────── */
  function applyNowPlayingConfig(np) {
    const body = document.body, posns = ['top-left','top-right','bottom-left','bottom-right'];
    posns.forEach(p => body.classList.remove('np-pos-' + p));
    body.classList.add('np-pos-' + (np && posns.includes(np.position) ? np.position : 'top-left'));
    body.classList.toggle('np-off', !!(np && np.enabled === false));
  }
  function renderNowPlaying(n) {
    const card = document.getElementById('np-card');
    if (!n || !n.videoId) { card.classList.remove('show'); return; }
    document.getElementById('np-img').src = n.thumb || '';
    document.getElementById('np-title').textContent = n.title || '';
    document.getElementById('np-sub').textContent = 'ขอโดย ' + (n.requester || '') + (n.channel ? ' · ' + n.channel : '');
    card.classList.add('show');
  }

  /* ── Chat config apply (live updates) ────────────────────────── */
  function applyChatConfig(c) {
    if (!c) return;
    const body = document.body;
    const chatPos = ['top-left','top-right','bottom-left','bottom-right'];
    chatPos.forEach(p => body.classList.remove('chat-pos-'+p));
    body.classList.add('chat-pos-' + (chatPos.includes(c.position) ? c.position : 'bottom-left'));
    body.classList.toggle('chat-hidden',    c.enabled === false);
    body.classList.toggle('chat-no-avatar', c.showAvatar === false);
    body.classList.toggle('chat-no-pill',   c.showPill   === false);
    body.classList.toggle('chat-no-badge',  c.showBadge  === false);
    if (typeof c.width === 'number')    body.style.setProperty('--chat-width',     c.width + 'px');
    if (typeof c.fontSize === 'number') body.style.setProperty('--chat-font-size', c.fontSize + 'px');
    if (typeof c.maxMessages === 'number')     CHAT_MAX_MESSAGES     = c.maxMessages;
    if (typeof c.messageDuration === 'number') CHAT_MESSAGE_DURATION = c.messageDuration;
    chatHiddenPlatforms = Array.isArray(c.hiddenPlatforms) ? c.hiddenPlatforms : [];
  }

  /* ── Audio ───────────────────────────────────────────────────── */
  let actx = null;
  function getCtx() { return actx || (actx = new (window.AudioContext||window.webkitAudioContext)()); }
  function playChime(amount) {
    try {
      const ctx = getCtx();
      const play = (f,t,d,v=.25)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(v,ctx.currentTime+t+.015);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+d);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+d+.05);};
      if (amount>=500){play(523,0,.5,.3);play(659,.1,.5,.3);play(784,.2,.5,.3);play(1047,.35,.8,.25);}
      else if(amount>=100){play(659,0,.4,.25);play(784,.12,.4,.25);play(1047,.24,.6,.2);}
      else{play(784,0,.3,.2);play(1047,.15,.45,.18);}
    }catch(e){}
  }

  /* ── Chat (social_stream-style) ──────────────────────────────── */
  let CHAT_MAX_MESSAGES     = 8;
  let CHAT_MESSAGE_DURATION = 25000;
  const CHAT_FADE_DURATION  = 450;
  const CHAT_PLAT_ICON = { youtube:'▶', tiktok:'♪', twitch:'🟣', kick:'🟢', facebook:'🔵' };
  let chatHiddenPlatforms = [];

  function appendChatMsg(data) {
    const { platform='unknown', displayName='viewer', message='',
            chatimg='', hasDonation=false, bits=0 } = data;
    if (chatHiddenPlatforms.includes(platform)) return;
    const icon    = CHAT_PLAT_ICON[platform] || '?';
    const initial = (displayName || '?').charAt(0).toUpperCase();
    const safeImg = String(chatimg || '').replace(/['"\\)(]/g, '');

    const zone = document.getElementById('chat-zone');
    const el   = document.createElement('div');
    el.className = 'chat-msg' + ((hasDonation || bits > 0) ? ' has-donation' : '');
    el.dataset.platform = platform;

    const avatarStyle = safeImg ? ` style="background-image:url('${safeImg}')"` : '';
    const avatarCls   = 'chat-avatar' + (safeImg ? ' has-img' : '');
    let badges = '';
    if (bits > 0)               badges += `<span class="chat-bits">⚡ ${bits}</span>`;
    if (hasDonation && !bits)   badges += `<span class="chat-dono">💰 SUPER</span>`;

    el.innerHTML =
      `<div class="${avatarCls}"${avatarStyle}>
        <span class="chat-avatar-fb">${esc(initial)}</span>
        <span class="chat-pill ${platform}">${icon}</span>
      </div>
      <div class="chat-body">
        <div class="chat-meta">
          <span class="chat-name ${platform}">${esc(displayName)}</span>
          ${badges}
        </div>
        <div class="chat-text">${esc(message)}</div>
      </div>`;
    zone.appendChild(el);

    el._fadeTimer = setTimeout(() => removeChatMsg(el), CHAT_MESSAGE_DURATION);

    // Cap by max — remove oldest non-fading
    const live = [...zone.children].filter(c => !c.classList.contains('fade-out'));
    if (live.length > CHAT_MAX_MESSAGES) removeChatMsg(live[0]);
  }

  function removeChatMsg(el) {
    if (!el || el.classList.contains('fade-out')) return;
    if (el._fadeTimer) { clearTimeout(el._fadeTimer); el._fadeTimer = null; }
    el.classList.add('fade-out');
    setTimeout(() => el.remove(), CHAT_FADE_DURATION);
  }

  /* ── Random chat spotlight (magnify + TTS) ─────────────────────── */
  let spotTimer = null, spotBusy = false, spotDuration = 6, spotPos = 'inplace';
  function applySpotlightConfig(sp) {
    if (spotTimer) { clearInterval(spotTimer); spotTimer = null; }
    if (!sp || !sp.enabled) return;
    spotDuration = Math.max(3, Number(sp.durationSec) || 6);
    spotPos = sp.position === 'top' ? 'top' : 'inplace';
    const everyMs = Math.max(10, Number(sp.intervalSec) || 60) * 1000;
    spotTimer = setInterval(runSpotlight, everyMs);
  }
  async function runSpotlight() {
    if (spotBusy) return;
    const zone = document.getElementById('chat-zone');
    if (!zone) return;
    // pool = currently-shown messages not yet spotlighted
    const pool = [...zone.children].filter(c =>
      c.classList.contains('chat-msg') && !c.classList.contains('fade-out') && !c.dataset.spot);
    if (!pool.length) return;
    const el = pool[Math.floor(Math.random() * pool.length)];
    el.dataset.spot = '1';
    spotBusy = true;

    const text = (el.querySelector('.chat-text')?.textContent || '').trim();
    const name = (el.querySelector('.chat-name')?.textContent || '').trim();

    if (spotPos === 'top') {
      // pull a big card to top-center of the screen
      const av = el.querySelector('.chat-avatar');
      const slAv = document.getElementById('sl-av');
      slAv.style.backgroundImage = (av && av.classList.contains('has-img')) ? av.style.backgroundImage : '';
      slAv.textContent = (av && av.classList.contains('has-img')) ? '' : (name.charAt(0).toUpperCase() || '?');
      document.getElementById('sl-name').textContent = name;
      document.getElementById('sl-text').textContent = text;
      document.getElementById('spotlight-zone').classList.add('show');
    } else {
      // magnify in place (Mac dock)
      if (el._fadeTimer) { clearTimeout(el._fadeTimer); el._fadeTimer = null; }
      el.classList.add('spotlight');
    }

    // read it aloud (server TTS)
    if (text) {
      try {
        const r = await fetch('/api/tts/speak', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        }).then(r => r.json());
        if (r?.audio) {
          const isWav = r.audio.startsWith('UklGR');
          new Audio(`data:${isWav ? 'audio/wav' : 'audio/mp3'};base64,${r.audio}`).play().catch(() => {});
        }
      } catch (e) {}
    }

    setTimeout(() => {
      if (spotPos === 'top') {
        document.getElementById('spotlight-zone').classList.remove('show');
      } else {
        el.classList.remove('spotlight');
        // give it a fresh fade-out window after shrinking back
        if (el.isConnected && !el.classList.contains('fade-out'))
          el._fadeTimer = setTimeout(() => removeChatMsg(el), CHAT_MESSAGE_DURATION);
      }
      spotBusy = false;
    }, spotDuration * 1000);
  }

  /* ── Featured message (manual / pinned) ──────────────────────────── */
  const PLAT_LABEL = { youtube:'YouTube', tiktok:'TikTok', twitch:'Twitch', kick:'Kick', facebook:'Facebook' };
  let featureTimer = null;
  function showFeature(f) {
    if (!f) return;
    if (featureTimer) { clearTimeout(featureTimer); featureTimer = null; }
    const name = String(f.displayName || 'viewer');
    const av   = document.getElementById('ft-av');
    const safeImg = String(f.chatimg || '').replace(/['"\\)(]/g, '');
    av.style.backgroundImage = safeImg ? `url('${safeImg}')` : '';
    av.textContent = safeImg ? '' : (name.charAt(0).toUpperCase() || '?');
    document.getElementById('ft-name').textContent = name;
    const pill = document.getElementById('ft-pill');
    pill.textContent = PLAT_LABEL[f.platform] || '';
    pill.style.display = PLAT_LABEL[f.platform] ? '' : 'none';
    document.getElementById('ft-text').textContent = String(f.message || '');
    document.getElementById('ft-pin').style.display = f.pin ? '' : 'none';
    document.getElementById('feature-zone').classList.add('show');

    if (f.tts !== false && f.message) {
      fetch('/api/tts/speak', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text: String(f.message).slice(0,200) }),
      }).then(r => r.json()).then(r => {
        if (r?.audio) {
          const isWav = r.audio.startsWith('UklGR');
          new Audio(`data:${isWav?'audio/wav':'audio/mp3'};base64,${r.audio}`).play().catch(()=>{});
        }
      }).catch(()=>{});
    }
    // Non-pinned cards auto-dismiss; pinned ones wait for an explicit clear.
    if (!f.pin) featureTimer = setTimeout(hideFeature, 10000);
  }
  function hideFeature() {
    if (featureTimer) { clearTimeout(featureTimer); featureTimer = null; }
    document.getElementById('feature-zone').classList.remove('show');
  }

  /* ── Giveaway winner (name-roll suspense → reveal) ────────────────── */
  let gwTimer = null;
  function showGiveawayWinner(w) {
    if (!w) return;
    if (gwTimer) { clearTimeout(gwTimer); gwTimer = null; }
    const zone   = document.getElementById('giveaway-zone');
    const nameEl = document.getElementById('gw-name');
    const labelEl= document.getElementById('gw-label');
    const emojiEl= document.getElementById('gw-emoji');
    const winner = String(w.displayName || 'ผู้โชคดี');
    const roll   = (Array.isArray(w.roll) && w.roll.length) ? w.roll : [winner];
    zone.classList.add('show');

    // ── roll phase: cycle names fast→slow ──
    labelEl.textContent = 'กำลังสุ่ม...';
    emojiEl.textContent = '🎲'; emojiEl.classList.add('spin');
    nameEl.classList.remove('reveal'); nameEl.classList.add('rolling');

    let delay = 60; const grow = 1.13, maxDelay = 430;
    function tick() {
      nameEl.textContent = roll[Math.floor(Math.random() * roll.length)];
      delay *= grow;
      if (delay < maxDelay) gwTimer = setTimeout(tick, delay);
      else reveal();
    }
    function reveal() {
      nameEl.textContent = winner;
      nameEl.classList.remove('rolling');
      void nameEl.offsetWidth; nameEl.classList.add('reveal');   // restart pop animation
      labelEl.textContent = 'ผู้โชคดีคือ';
      emojiEl.textContent = '🎉'; emojiEl.classList.remove('spin');
      spawnConfetti(500);
      gwTimer = setTimeout(() => zone.classList.remove('show'), 12000);
    }
    tick();
  }

  /* ── Alert queue (FIFO — visual + audio both complete before next) ── */
  const alertQueue = []; let alertBusy = false;
  function processQueue() { if(alertBusy||!alertQueue.length)return; alertBusy=true; showAlert(alertQueue.shift()); }
  function showAlert(data) {
    const name=data.displayName||'ไม่ระบุ', amount=data.amount??0;
    document.getElementById('alert-avatar').textContent = name.charAt(0).toUpperCase();
    document.getElementById('alert-name').textContent   = name;
    document.getElementById('alert-amount').textContent = '฿'+amount.toLocaleString('th-TH');
    const msgEl = document.getElementById('alert-message');
    if(data.message){msgEl.textContent=data.message;msgEl.style.display='block';}
    else msgEl.style.display='none';
    const card = document.getElementById('alert-card');
    card.classList.remove('hide'); void card.offsetWidth; card.classList.add('show');
    playChime(amount);
    if(amount>=100)spawnConfetti(amount);

    const visualDur = 8000+(data.message?Math.min(data.message.length*40,3000):0);
    const visualEnd = new Promise(resolve=>{
      setTimeout(()=>{
        card.classList.remove('show'); card.classList.add('hide');
        setTimeout(()=>{ card.classList.remove('hide'); resolve(); },350);
      }, visualDur);
    });

    const audioEnd = data.ttsAudio
      ? new Promise(resolve=>{
          const isWav=data.ttsAudio.startsWith('UklGR'),mime=isWav?'audio/wav':'audio/mp3';
          const a=new Audio(`data:${mime};base64,${data.ttsAudio}`);
          let done=false; const finish=()=>{ if(done)return; done=true; resolve(); };
          a.onended=finish; a.onerror=finish;
          setTimeout(()=>a.play().catch(finish),600);
          // hard safety cap — 60s
          setTimeout(finish, 60000);
        })
      : Promise.resolve();

    Promise.all([visualEnd, audioEnd]).then(()=>{ alertBusy=false; processQueue(); });
  }

  /* ── Confetti ────────────────────────────────────────────────── */
  const COLORS=['#7c5cfc','#ec4899','#f59e0b','#22c55e','#38bdf8','#fff','#fb923c'];
  function spawnConfetti(amount) {
    const count=amount>=500?120:amount>=100?70:40, c=document.getElementById('confetti-wrap');
    for(let i=0;i<count;i++){
      const p=document.createElement('div'),size=5+Math.random()*9,circle=Math.random()>.4;
      p.className='cp';
      p.style.cssText=`left:${Math.random()*100}%;top:0;background:${COLORS[~~(Math.random()*COLORS.length)]};width:${size}px;height:${size}px;border-radius:${circle?'50%':'2px'};animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()}s;`;
      c.appendChild(p);p.addEventListener('animationend',()=>p.remove());
    }
  }

  /* ── Goal ────────────────────────────────────────────────────── */
  function updateGoal(data) {
    const {current=0,target=0,title='Goal วันนี้'}=data;
    const zone=document.getElementById('goal-zone');
    if(!target||target<=0){zone.classList.remove('visible');return;}
    zone.classList.add('visible');
    document.getElementById('goal-title-text').textContent=title;
    document.getElementById('goal-current').textContent='฿'+current.toLocaleString('th-TH');
    document.getElementById('goal-target').textContent='฿'+target.toLocaleString('th-TH');
    const pct=Math.min(100,Math.round(current/target*100));
    document.getElementById('goal-fill').style.width=pct+'%';
    const pctEl=document.getElementById('goal-percent');
    pctEl.textContent=pct>=100?'🎉 ถึง Goal แล้ว!':pct+'%';
    pctEl.style.color=pct>=100?'var(--t-green)':'';
  }

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
